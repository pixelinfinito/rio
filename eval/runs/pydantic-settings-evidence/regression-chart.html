<!doctype html><html><head><meta charset="utf-8"><style>
:root{font-family:var(--font-sans);color:var(--foreground)}
body{margin:0} .chart{font-size:13px;padding:8px 0}
.legend{display:flex;gap:20px;color:var(--muted-foreground);margin:0 0 16px}
.key{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px}
.row{display:grid;grid-template-columns:92px minmax(80px,1fr) 56px;gap:10px;align-items:center;margin:9px 0}
.track{height:16px;display:flex;align-items:stretch}.u{background:var(--chart-1)}.c{background:var(--chart-2)}
.bar{border-radius:3px;min-width:2px}.count{text-align:right;font-variant-numeric:tabular-nums}
small{display:block;color:var(--muted-foreground);margin-top:14px;line-height:1.5}
</style></head><body><div class="chart" role="img" aria-label="Visible findings regression: PR 1109 fell from 1408 to 1, and PR 1097 from 1362 to 1. Each current run has zero unclassified findings and working baseline classification.">
<div class="legend"><span><i class="key u"></i>Unclassified</span><span><i class="key c"></i>Classified</span></div>
<div class="row"><span>#1109 before</span><div class="track"><span class="bar u" style="width:99.93%"></span><span class="bar c" style="width:0.07%"></span></div><span class="count">1,408</span></div>
<div class="row"><span>#1109 now</span><div class="track"><span class="bar c" style="width:0.07%"></span></div><span class="count">1</span></div>
<div class="row"><span>#1097 before</span><div class="track"><span class="bar u" style="width:96.66%"></span><span class="bar c" style="width:0.07%"></span></div><span class="count">1,362</span></div>
<div class="row"><span>#1097 now</span><div class="track"><span class="bar c" style="width:0.07%"></span></div><span class="count">1</span></div>
<small>Both current runs: baseline classification succeeded; zero unclassified findings.<br>Each remaining alert is a false positive on dummy credentials in tests.</small>
</div></body></html>
