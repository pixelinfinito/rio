name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      RIO_REQUIRE_TOOLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install toolchains and fixture dependencies
        run: |
          python -m pip install pyright mypy ruff coverage pytest
          npm ci --prefix tests/fixtures/ts-sample
          pnpm --dir tests/fixtures/monorepo-sample install --frozen-lockfile
          uv sync --project tests/fixtures/py-sample --frozen
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo llvm-cov --version
          cargo test --locked --manifest-path tests/fixtures/rs-sample/Cargo.toml
          ruff --version
          pyright --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Fixture test suites
        run: |
          npm --prefix tests/fixtures/ts-sample test -- --maxWorkers=2 --minWorkers=1
          pnpm --dir tests/fixtures/monorepo-sample -r test --maxWorkers=2 --minWorkers=1
          tests/fixtures/py-sample/.venv/bin/python -m pytest -q tests/fixtures/py-sample/tests
      - name: Require the installed Ruff tool
        run: |
          mv tests/fixtures/py-sample/.venv/bin/ruff tests/fixtures/py-sample/.venv/bin/ruff.saved
          trap 'mv tests/fixtures/py-sample/.venv/bin/ruff.saved tests/fixtures/py-sample/.venv/bin/ruff' EXIT
          if cargo test -p rio-cli --test fixtures python_fixture_all_modes_and_formats; then
            echo 'Missing Ruff was incorrectly allowed under RIO_REQUIRE_TOOLS=1' >&2
            exit 1
          fi
      - name: Require the installed Rust coverage tool
        run: |
          tool_path=$(command -v cargo-llvm-cov)
          mv "$tool_path" "$tool_path.saved"
          trap 'mv "$tool_path.saved" "$tool_path"' EXIT
          if cargo test -p rio-adapters --test rust real_rust_coverage_keeps_failures_and_distinguishes_zero_tests; then
            echo 'Missing cargo-llvm-cov was incorrectly allowed under RIO_REQUIRE_TOOLS=1' >&2
            exit 1
          fi
      - name: Unix installer
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y shellcheck; else brew install shellcheck; fi
          shellcheck -s sh scripts/install.sh
          python3 -m unittest discover -s tests/installers -v
          python3 -m unittest discover -s tests/release -v
      - name: Acceptance record is complete
        run: python3 scripts/check-acceptance.py --record-only
      - name: Evaluation harness
        run: python3 -m unittest discover -s eval/tests -v
      - name: Profile reference is current
        run: |
          python3 scripts/generate-profile-reference.py
          git diff --exit-code -- docs/profiles.md
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test -p rio-adapters --test process --locked
      - run: cargo build -p rio-cli --locked
      - name: PowerShell analyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path scripts/install.ps1 -EnableExit
      - name: Installer on PowerShell 7
        shell: pwsh
        run: ./tests/installers/windows.ps1 -Shell pwsh
      - name: Installer on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/installers/windows.ps1 -Shell powershell

  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - run: npm run check --prefix worker
      - run: npm test --prefix worker
      - run: python3 -m unittest discover -s worker/runner/tests -v
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p rio-runner
      - run: docker build -f worker/Dockerfile -t rio-runner:0.3.0 .
      - name: Runner protocol and Docker isolation
        run: RIO_TEST_DOCKER=1 RIO_RUNNER_IMAGE=rio-runner:0.3.0 python3 -m unittest discover -s worker/runner/tests -v
      - run: npm run dry-run --prefix worker
