name: Noise
# Nightly harmful-noise measurement on known-clean PRs (eval/README.md, "Noise
# measurement"). Reviews run against the configured Rio endpoint with the pinned
# provider profile; the endpoint holds the provider keys it was deployed with.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Reference repository (owner/repo); empty reviews this repository'
        required: false
        default: ''
      limit:
        description: 'Most recent known-clean PRs to review'
        required: false
        default: '20'
permissions:
  contents: read
concurrency:
  group: noise
  cancel-in-progress: false
jobs:
  noise:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      RIO_NOISE_PROFILE: rio/openrouter
      NOISE_REPOSITORY: ${{ inputs.repository || github.repository }}
      NOISE_LIMIT: ${{ inputs.limit || '20' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Rio
        run: cargo build --release --locked -p rio-cli
      - name: Prepare reference repository
        run: |
          echo "NOISE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          if [ "$NOISE_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            echo "NOISE_REPO_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            git clone --quiet "https://github.com/$NOISE_REPOSITORY.git" "$RUNNER_TEMP/reference"
            echo "NOISE_REPO_DIR=$RUNNER_TEMP/reference" >> "$GITHUB_ENV"
          fi
      - name: Run rio eval noise
        id: noise
        env:
          RIO_ENDPOINT_URL: ${{ secrets.RIO_ENDPOINT_URL }}
          RIO_API_TOKEN: ${{ secrets.RIO_API_TOKEN }}
        run: |
          set -o pipefail
          RIO_EVAL_DIR="$GITHUB_WORKSPACE/eval" "$GITHUB_WORKSPACE/target/release/rio" eval noise \
            --repo "$NOISE_REPO_DIR" \
            --repository "$NOISE_REPOSITORY" \
            --rio "$GITHUB_WORKSPACE/target/release/rio" \
            --profile "$RIO_NOISE_PROFILE" \
            --limit "$NOISE_LIMIT" \
            --date "$NOISE_DATE" \
            --out-root "$GITHUB_WORKSPACE/eval/runs/noise" 2>&1 | tee "$RUNNER_TEMP/noise.log"
      - name: Keep the job log with the run
        if: always()
        run: |
          dir="eval/runs/noise/$NOISE_DATE"
          if [ -d "$dir" ] && [ -f "$RUNNER_TEMP/noise.log" ]; then
            mkdir -p "$dir/logs"
            cp "$RUNNER_TEMP/noise.log" "$dir/logs/noise.log"
          fi
      - name: Credential scan of logs and artifact
        id: scan
        if: always()
        env:
          RIO_API_TOKEN: ${{ secrets.RIO_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          dir="eval/runs/noise/$NOISE_DATE"
          test -d "$dir"
          python3 -I eval/credscan.py \
            --env RIO_API_TOKEN --env OPENROUTER_API_KEY --env ANTHROPIC_API_KEY --env OPENAI_API_KEY \
            "$dir" "$RUNNER_TEMP/noise.log"
      - name: Upload dated noise directory
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: noise-${{ env.NOISE_DATE }}
          path: eval/runs/noise/${{ env.NOISE_DATE }}
          retention-days: 90
          if-no-files-found: error
