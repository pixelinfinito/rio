kind: step
name: rio/report
version: 0.1.0
description: Report the review artifacts
local: true
inputs: ["findings", "check_outcomes", "impact", "verified_findings"]
outputs: ["report"]
schema: {"type": "object", "additionalProperties": false, "properties": {"class_threshold": {"type": "integer", "minimum": 1, "default": 3, "description": "Agent findings sharing rule and trigger across more symbols than this merge into one class-level finding"}, "proposal_threshold": {"type": "integer", "minimum": 1, "default": 3, "description": "Dismissals with reason irrelevant or style on one rule or directory that yield a suppression proposal"}}}
