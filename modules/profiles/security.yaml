version: 1
name: rio/security
extends: rio/base
# The security community profile: rio/base with the security step enabled,
# thorough posture, the ASVS 5.0 catalog and the council with its five default
# triggers. A child's `steps` replaces the inherited list, so every base step is
# repeated. The council's members stay placeholders until `rio init` writes the
# repository's council allowlist, which is the opt-in; the profile allows the
# vendors Rio knows.
#
# The security agent reviews under two models, `default` and `second`, and what
# both raise is verified once. The profile defines neither: the child that adds
# `models` and `budget` for a deployment picks them, and a child that defines no
# `second` gets one review under `default`. Pick models of two vendors for
# `default` and `second`; the verifier has to be a third model when one voter
# settles a hypothesis.
steps:
  - id: prepare
    uses: rio/prepare@0.1.0
    with: { exclude: [] }
  - id: checks
    uses: rio/checks@0.1.0
    needs: [prepare]
    parallel: true
    with:
      typecheck: true
      lint: true
      secrets: true
      coverage: true
      dependencies: true
      baseline: true
      trust_installed_dependencies: false
  - id: graph
    uses: rio/graph@0.1.0
    needs: [prepare]
    parallel: true
    with: { hops: 2, max_nodes: 2000 }
  - id: triage
    uses: rio/triage@0.1.0
    needs: [checks, graph]
    rules: []
  - id: agents
    uses: rio/agents@0.1.0
    needs: [triage]
    agents: []
  - id: security
    uses: rio/security@0.2.0
    needs: [triage]
    with: { enabled: true, posture: thorough, catalog: asvs-5.0 }
    agents:
      - security: { models: [default, second] }
  - id: qa
    uses: rio/qa@0.1.0
    needs: [graph]
    with: { enabled: false }
  - id: verify
    uses: rio/verify@0.1.0
    needs: [agents, security, qa]
  - id: council
    uses: rio/council@0.1.0
    needs: [verify]
    with: { enabled: true }
    rules:
      - when: "evidence == plausible and severity >= error"
      - when: verify.split
      - when: "risk_tier == high"
      - when: "mode == deep"
      - when: nightly
  - id: report
    uses: rio/report@0.1.0
    needs: [checks, graph, council, qa]
council:
  vendors_allowed: [anthropic, openai, google, mistral, xai, deepseek, openrouter]
