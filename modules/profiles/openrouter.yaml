version: 1
name: rio/openrouter
extends: rio/base
models:
  default: openrouter/anthropic/claude-sonnet-5.5
  verifier: openrouter/openai/gpt-6.1-sol
# Every model turn resends the whole conversation, and the gateway bounds each call
# by its UTF-8 bytes (about three times the token count for code). An agent review
# of a real repository runs 6 to 12 turns of 30k to 50k tokens (about 500k in
# total), and each voter's blind and disclosed passes run several tool turns
# (about 40k actual tokens per voter). `tokens` caps the whole review, agents and
# voters together, so it is sized for both; the ledger charges actual tokens, and
# pilots on real repositories cost between USD 0.5 and 1.2 per review.
budget:
  fast: { tokens: 1200000, agents_max: 1, wall_time: 8m, verify_tokens: 320000 }
  deep: { tokens: 2000000, agents_max: 2, wall_time: 15m, verify_tokens: 400000 }
verify: { voters: 3, quorum: 2 }
steps:
  - id: prepare
    uses: rio/prepare@0.1.0
    with: { exclude: [] }
  - id: checks
    uses: rio/checks@0.1.0
    needs: [prepare]
    parallel: true
    with:
      typecheck: true
      lint: true
      secrets: true
      coverage: true
      dependencies: true
      baseline: true
      trust_installed_dependencies: false
  - id: graph
    uses: rio/graph@0.1.0
    needs: [prepare]
    parallel: true
    with: { hops: 2, max_nodes: 2000 }
  - id: triage
    uses: rio/triage@0.1.0
    needs: [checks, graph]
    rules: []
  - id: agents
    uses: rio/agents@0.1.0
    needs: [triage]
    agents:
      - correctness: { model: default }
  - id: security
    uses: rio/security@0.2.0
    needs: [triage]
    with: { enabled: false }
  - id: verify
    uses: rio/verify@0.1.0
    needs: [agents, security]
  - id: report
    uses: rio/report@0.1.0
    needs: [checks, graph, verify]
