version: 1
name: rio/openrouter
extends: rio/base
models:
  default: openrouter/anthropic/claude-sonnet-5.5
  verifier: openrouter/openai/gpt-6.1-sol
# Every model turn resends the whole conversation, and the gateway bounds each call
# by its UTF-8 bytes (about three times the token count for code). An agent review
# of a real repository runs 6 to 12 turns of 30k to 50k tokens (about 500k in
# total), and each voter's blind and disclosed passes run several tool turns
# (about 40k actual tokens per voter). `tokens` caps the whole review, every agent
# (the security step runs its own) and all voters together, so it is sized for two
# agents; the ledger charges actual tokens, and pilots on real repositories cost
# between USD 0.4 and 2.1 per review.
#
# `wall_time` covers the whole review and is a backstop, not the usual duration:
# with up to ten defects and ten risks verified, half of 79 reviews of large pull
# requests took under five minutes, 12 ran past eight and the longest took just
# over fourteen; a repeat of that one ran past fifteen. A review the wall cuts
# reports what it had verified and lists the rest as unverified.
budget:
  fast: { tokens: 2400000, agents_max: 1, wall_time: 25m, verify_tokens: 320000 }
  deep: { tokens: 4000000, agents_max: 2, wall_time: 25m, verify_tokens: 400000 }
# `risk_voters` of the voters examine a hypothesis the agent classed as a risk.
# One is enough when the verifier is another model than the agent's: on 116 such
# hypotheses the second and third voter changed no outcome. A profile with one
# model for both aliases needs every voter (`risk_voters: 3`).
verify: { voters: 3, quorum: 2, risk_voters: 1 }
steps:
  - id: prepare
    uses: rio/prepare@0.1.0
    with: { exclude: [] }
  - id: checks
    uses: rio/checks@0.1.0
    needs: [prepare]
    parallel: true
    with:
      typecheck: true
      lint: true
      secrets: true
      coverage: true
      dependencies: true
      baseline: true
      trust_installed_dependencies: false
  - id: graph
    uses: rio/graph@0.1.0
    needs: [prepare]
    parallel: true
    with: { hops: 2, max_nodes: 2000 }
  - id: triage
    uses: rio/triage@0.1.0
    needs: [checks, graph]
    rules: []
  - id: agents
    uses: rio/agents@0.1.0
    needs: [triage]
    agents:
      - correctness: { model: default }
  - id: security
    uses: rio/security@0.2.0
    needs: [triage]
    with: { enabled: false }
  - id: verify
    uses: rio/verify@0.1.0
    needs: [agents, security]
  - id: report
    uses: rio/report@0.1.0
    needs: [checks, graph, verify]
