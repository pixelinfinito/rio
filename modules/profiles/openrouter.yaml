version: 1
name: rio/openrouter
extends: rio/base
models:
  default: openrouter/anthropic/claude-sonnet-5.5
  verifier: openrouter/openai/gpt-6.1-sol
# The gateway bounds each call by the UTF-8 bytes of the whole conversation, so a
# generation turn over a real repository (prompt, then up to 64 KiB of tool results
# per round) needs a few hundred thousand units; the ledger charges actual tokens.
budget:
  fast: { tokens: 320000, agents_max: 1, wall_time: 8m, verify_tokens: 48000 }
  deep: { tokens: 640000, agents_max: 2, wall_time: 15m, verify_tokens: 64000 }
verify: { voters: 3, quorum: 2 }
steps:
  - id: prepare
    uses: rio/prepare@0.1.0
    with: { exclude: [] }
  - id: checks
    uses: rio/checks@0.1.0
    needs: [prepare]
    parallel: true
    with:
      typecheck: true
      lint: true
      secrets: true
      coverage: true
      dependencies: true
      baseline: true
      trust_installed_dependencies: false
  - id: graph
    uses: rio/graph@0.1.0
    needs: [prepare]
    parallel: true
    with: { hops: 2, max_nodes: 2000 }
  - id: triage
    uses: rio/triage@0.1.0
    needs: [checks, graph]
    rules: []
  - id: agents
    uses: rio/agents@0.1.0
    needs: [triage]
    agents:
      - correctness: { model: default }
  - id: security
    uses: rio/security@0.2.0
    needs: [triage]
    with: { enabled: false }
  - id: verify
    uses: rio/verify@0.1.0
    needs: [agents, security]
  - id: report
    uses: rio/report@0.1.0
    needs: [checks, graph, verify]
