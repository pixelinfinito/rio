[entropy]
threshold = 3.5
min_length = 20
names = '(?i)secret|token|password|passwd|api[_-]?key|private[_-]?key'

[[patterns]]
id = "aws-access-key"
regex = '\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'

[[patterns]]
id = "github-token"
regex = '\b(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})\b'

[[patterns]]
id = "gitlab-token"
regex = '\bglpat-[A-Za-z0-9_-]{20,}\b'

[[patterns]]
id = "slack-token"
regex = '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'

[[patterns]]
id = "stripe-key"
regex = '\bsk_live_[A-Za-z0-9]{24,}\b'

[[patterns]]
id = "private-key"
regex = '-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----[\s\S]*?-----END (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'

[[patterns]]
id = "connection-string"
regex = """(?i)\\b(?:postgres(?:ql)?|mysql|mongodb(?:\\+srv)?|redis)://[^\\s:/]+:[^\\s@]+@[^\\s\"'<>),;]+"""
